name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        # Blocking: zero eslint errors. Some React Compiler hook rules are set
        # to "warn" in eslint.config.mjs (a tracked refactor) and don't fail CI.
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Dummy values — the build must not depend on real credentials.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          AI_GATEWAY_API_KEY: ci-dummy-gateway-key

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations to a fresh database
        # `supabase start` provisions a clean Postgres and applies every file in
        # supabase/migrations/ in order. It exits non-zero if any migration fails.
        run: supabase start

      - name: Lint the resulting schema
        run: supabase db lint --level warning

      - name: Fail if the schema drifts from the migrations
        # Catches a schema change that was made without a matching migration file.
        run: |
          DIFF=$(supabase db diff --local)
          if [ -n "$DIFF" ]; then
            echo "::error::Schema differs from migrations — add a migration for your change."
            echo "$DIFF"
            exit 1
          fi
